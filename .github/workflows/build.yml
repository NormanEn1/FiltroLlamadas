name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK debug y lint
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lint --no-daemon

      - name: Verificar que no hay permiso INTERNET
        run: |
          AAPT2=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          if $AAPT2 dump permissions app/build/outputs/apk/debug/app-debug.apk | grep -q "android.permission.INTERNET"; then
            echo "::error::El APK declara INTERNET"; exit 1
          fi

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: filtro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
